# 화면 스크린샷 전용 프로젝트(.github/workflows/ui-shots.yml).
# 앱 화면 코드(WifiScan/)만 시뮬레이터용 Debug로 빌드한다. 터널 확장(Go/Rust)은 빼서 빠르다.
name: UIShots
options:
  bundleIdPrefix: com.nago
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  UIShots:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ../../WifiScan
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nago.uishots
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NAGO VPN
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        UILaunchScreen: {}
        # net scan의 portal 검사: captive.apple.com을 일부러 평문 http로 받아 바꿔치기를 본다
        NSAppTransportSecurity:
          NSExceptionDomains:
            captive.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
