AWSTemplateFormatVersion: "2010-09-09"
Description: >
  WifiScan VPN - IKEv2/EAP-MSCHAPv2 server (strongSwan on Ubuntu 22.04).
  EIP + Security Group(UDP 500/4500) + SSM-enabled IAM role + EC2 instance.
  부팅 시 자체 CA/서버 인증서를 만들고, CA 인증서는 SSM 파라미터 스토어에 올립니다.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPN 서버를 둘 VPC (기본 VPC 사용 가능)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 퍼블릭 서브넷 ID (인터넷 게이트웨이로 라우팅되는 서브넷)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.nano, t3.micro, t3.small, t4g.micro]
    Description: 인스턴스 타입 (strongSwan은 작은 인스턴스로 충분)
  EapUsername:
    Type: String
    Default: wifiscan
    Description: VPN 로그인 사용자 이름
  EapPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: VPN 로그인 비밀번호 (8자 이상, 로그에 남지 않음)
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Ubuntu 22.04 최신 AMI (SSM 공개 파라미터, 보통 그대로 둠)

Resources:
  VpnEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-eip" }

  VpnSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WifiScan IKEv2 VPN - UDP 500/4500
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: udp, FromPort: 500,  ToPort: 500,  CidrIp: 0.0.0.0/0, Description: IKE }
        - { IpProtocol: udp, FromPort: 4500, ToPort: 4500, CidrIp: 0.0.0.0/0, Description: "IKE NAT-T" }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-sg" }

  VpnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: put-ca-parameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wifiscan-vpn/${AWS::StackName}/*"

  VpnInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref VpnRole]

  VpnInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref VpnSecurityGroup]
      IamInstanceProfile: !Ref VpnInstanceProfile
      SourceDestCheck: false   # NAT 게이트웨이 역할이라 꺼야 함
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }
      UserData:
        Fn::Base64:
          Fn::Join:
            - ""
            - - "#!/bin/bash\nset -euxo pipefail\n"
              - "export DEBIAN_FRONTEND=noninteractive\n"
              - "export VPN_PUBLIC_IP='"
              - !Ref VpnEip
              - "'\nexport VPN_EAP_USER='"
              - !Ref EapUsername
              - "'\nexport VPN_EAP_PASS='"
              - !Ref EapPassword
              - "'\nexport CA_PARAM='/wifiscan-vpn/"
              - !Ref AWS::StackName
              - "/ca-cert'\nexport AWS_DEFAULT_REGION='"
              - !Ref AWS::Region
              - "'\n"
              - |
                VPN_POOL=10.10.10.0/24
                cloud-init status --wait || true
                for i in $(seq 1 30); do apt-get update -y && break || sleep 10; done
                echo "iptables-persistent iptables-persistent/autosave_v4 boolean true" | debconf-set-selections
                echo "iptables-persistent iptables-persistent/autosave_v6 boolean true" | debconf-set-selections
                apt-get install -y strongswan strongswan-pki libcharon-extra-plugins \
                    libcharon-extauth-plugins libstrongswan-extra-plugins iptables-persistent openssl awscli

                mkdir -p /etc/ipsec.d/cacerts /etc/ipsec.d/certs /etc/ipsec.d/private
                openssl genrsa -out /etc/ipsec.d/private/ca-key.pem 3072
                openssl req -x509 -new -nodes -key /etc/ipsec.d/private/ca-key.pem -sha256 -days 3650 \
                    -subj "/CN=WifiScan VPN Root CA/O=WifiScan" -out /etc/ipsec.d/cacerts/ca-cert.pem
                openssl genrsa -out /etc/ipsec.d/private/server-key.pem 3072
                openssl req -new -key /etc/ipsec.d/private/server-key.pem \
                    -subj "/CN=${VPN_PUBLIC_IP}/O=WifiScan" -out /tmp/server.csr
                cat > /tmp/ext.cnf <<EXT
                basicConstraints=CA:FALSE
                keyUsage=digitalSignature,keyEncipherment
                extendedKeyUsage=serverAuth
                subjectAltName=IP:${VPN_PUBLIC_IP}
                EXT
                openssl x509 -req -in /tmp/server.csr -CA /etc/ipsec.d/cacerts/ca-cert.pem \
                    -CAkey /etc/ipsec.d/private/ca-key.pem -CAcreateserial \
                    -out /etc/ipsec.d/certs/server-cert.pem -days 1825 -sha256 -extfile /tmp/ext.cnf
                chmod 600 /etc/ipsec.d/private/*.pem

                cat > /etc/ipsec.conf <<EOF
                config setup
                    charondebug="ike 1, knl 1, cfg 0"
                    uniqueids=never

                conn ikev2-vpn
                    auto=add
                    compress=no
                    type=tunnel
                    keyexchange=ikev2
                    fragmentation=yes
                    forceencaps=yes
                    dpdaction=clear
                    dpddelay=300s
                    rekey=no
                    left=%any
                    leftid=${VPN_PUBLIC_IP}
                    leftcert=server-cert.pem
                    leftsendcert=always
                    leftsubnet=0.0.0.0/0
                    right=%any
                    rightid=%any
                    rightauth=eap-mschapv2
                    rightsourceip=${VPN_POOL}
                    rightdns=1.1.1.1,8.8.8.8
                    rightsendcert=never
                    eap_identity=%identity
                    ike=aes256gcm16-prfsha256-ecp256,aes256-sha256-modp2048,aes256-sha256-ecp256,aes128-sha256-modp2048
                    esp=aes256gcm16-ecp256,aes256-sha256,aes128-sha256
                EOF

                cat > /etc/ipsec.secrets <<EOF
                : RSA "server-key.pem"
                ${VPN_EAP_USER} : EAP "${VPN_EAP_PASS}"
                EOF
                chmod 600 /etc/ipsec.secrets

                cat > /etc/sysctl.d/99-vpn.conf <<EOF
                net.ipv4.ip_forward=1
                net.ipv4.conf.all.accept_redirects=0
                net.ipv4.conf.all.send_redirects=0
                EOF
                sysctl -p /etc/sysctl.d/99-vpn.conf

                DEFIF=$(ip route get 1.1.1.1 | awk '{print $5; exit}')
                iptables -t nat -A POSTROUTING -s "$VPN_POOL" -o "$DEFIF" -j MASQUERADE
                iptables -A FORWARD -s "$VPN_POOL" -j ACCEPT
                iptables -A FORWARD -d "$VPN_POOL" -j ACCEPT
                iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
                netfilter-persistent save

                systemctl enable strongswan-starter
                systemctl restart strongswan-starter

                # CA 인증서를 SSM 파라미터 스토어에 올려 두면 운영자가 받아서 아이폰에 설치할 수 있다.
                aws ssm put-parameter --name "$CA_PARAM" --type String --overwrite \
                    --value "$(cat /etc/ipsec.d/cacerts/ca-cert.pem)"

  VpnEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt VpnEip.AllocationId
      InstanceId: !Ref VpnInstance

Outputs:
  ServerPublicIp:
    Description: 앱의 VPN 탭 '서버 주소'에 넣을 공인 IP
    Value: !Ref VpnEip
  EapUsername:
    Description: 앱의 VPN 탭 '사용자 이름'
    Value: !Ref EapUsername
  CaParameterName:
    Description: CA 인증서가 저장된 SSM 파라미터 이름
    Value: !Sub "/wifiscan-vpn/${AWS::StackName}/ca-cert"
  GetCaCertCommand:
    Description: CA 인증서(ca-cert.pem)를 내려받는 명령
    Value: !Sub "aws ssm get-parameter --region ${AWS::Region} --name /wifiscan-vpn/${AWS::StackName}/ca-cert --query Parameter.Value --output text > ca-cert.pem"
