[package]
name = "nago_tun"
version = "0.1.0"
edition = "2021"
publish = false
description = "NAGO VPN: NagoTun(WireGuard) 엔진을 iOS 터널 확장·안드로이드 앱에서 부르기 위한 작은 C 인터페이스"
license = "MIT"

# engine/도 같은 Cargo.lock·target을 쓰게(엔진 테스트: cargo test -p nagotun_engine --features device --lib)
[workspace]
members = [".", "engine"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# nagoing 난독화 nonce·난수용(OS 난수). 작고 git이 아니라 가볍다.
getrandom = "0.2"
# nagoing v2: 진짜 TLS 1.3(TCP 443 경로). ring 백엔드만 — 엔진이 이미 ring을 쓴다. TLS 1.2·로깅 끔.
rustls = { version = "=0.23.27", default-features = false, features = ["ring", "std"] }
# nagoing v2: 세션 AEAD(ChaCha20-Poly1305)·HKDF·HMAC. 엔진과 같은 버전.
ring = { version = "0.17.14", default-features = false }
# nagoing v2: 클라 WG 키 ↔ 서버 WG 키 X25519로 HELLO를 인증한다(세션 가로채기 방지). 엔진과 같은 버전.
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"], default-features = false }
# NagoTun 엔진: NordVPN의 NepTUN(BoringTun 포크, BSD-3-Clause, rev ce18515)을 engine/에 가져와 고친 것.
# 무엇을 바꿨는지는 engine/README.md
engine = { package = "nagotun_engine", path = "engine", features = ["device"] }
# 0.2.187부터 iOS에서 sockaddr_ctl 등을 macOS 전용으로 막아 nix(neptun 의존성)가 iOS로 안 빌드됨. NepTUN이 쓰는 버전으로 고정.
libc = "=0.2.186"
base64 = "0.22"
# nagoing TCP 소켓을 연결 전에 만들어 두려고(안드로이드 protect는 connect 전에 해야 한다). 엔진과 같은 버전.
socket2 = "0.6"

# 안드로이드 앱(Kotlin)에서 부르는 JNI 함수용(src/android.rs)
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

# 시험·벤치(리눅스)에서 엔진을 가짜 tun으로 띄워 nagoing 직결(nago_nagoing_attach)까지 끝에서 끝으로 확인한다.
# dev 빌드(test·example)에서만 켜진다 — 앱(staticlib)·서버 빌드엔 안 들어간다.
[dev-dependencies]
engine = { package = "nagotun_engine", path = "engine", features = ["device", "mock-tun"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
