[package]
# NagoTun 엔진 — NordSecurity NepTUN(BoringTun 포크)을 가져와 NAGO VPN에 맞게 고친 것.
# 가져온 곳: https://github.com/NordSecurity/NepTUN rev ce185155e1639403cc40e01260d0830065a49555 (neptun 2.2.3)
name = "nagotun_engine"
description = "NagoTun: WireGuard engine for NAGO VPN (fork of NordSecurity NepTUN)"
version = "2.2.3-nago.1"
authors = [
    "Noah Kennedy <nkennedy@cloudflare.com>",
    "Andy Grover <agrover@cloudflare.com>",
    "Jeff Hiner <jhiner@cloudflare.com>",
]
license = "BSD-3-Clause"
edition = "2018"
publish = false

[features]
default = []
device = ["socket2", "thiserror"]
# mocks std::time::Instant with mock_instant
mock-instant = ["mock_instant"]
xray = []
docker-tests = []

[dependencies]
base64 = "0.22.1"
zeroize = { version = "1.9.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
hex = { version = "0.4" }
untrusted = "0.9.0"
libc = { version = "0.2", default-features = false }
parking_lot = "0.12"
tracing =  { version = "0.1.44", default-features = false }
ip_network = "0.4.1"
ip_network_table = "0.2.0"
ring = { version = "0.17.14", default-features = false }
x25519-dalek = { version = "=2.0.1", features = ["reusable_secrets", "static_secrets"], default-features = false }
rand_core = { version = "0.6.4", features = ["getrandom"], default-features = false }
chacha20poly1305 = { features = ["alloc"], default-features = false, version = "0.10" }
aead = { version = "0.5", default-features = false }
blake2 = { version = "0.10", default-features = false }
hmac = "0.12"
mock_instant = { version = "0.6", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
thiserror = { version = "2", optional = true }
num_cpus = "1.17.0"
subtle = "2.6.1"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
dispatch2 = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "ioctl",
    "time",
    "user",
    "socket",
] }

# 엔진 단위 테스트(cargo test -p nagotun_engine --features device). 폰 빌드에는 들어가지 않는다
[dev-dependencies]
etherparse = "0.20"
tracing-subscriber = "0.3"
rand = "0.10"
tokio = { version = ">=1.22", features = ["rt", "net", "sync", "macros"] }
test-log = { version = "0.2.21", features = ["trace"] }

[lib]
crate-type = ["rlib"]
