name: NagoTL
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  # 말풍선 정밀화·원문 지우기·식자·Claude 요청·CBZ(UI 없음, 리눅스/맥에서 swift test)
  NagoTLCore:
    path: Core
settings:
  base:
    DEVELOPMENT_TEAM: ""          # ← 본인 Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  NagoTL:
    type: application
    platform: iOS
    sources:
      - App
      # NAGO VPN·DL과 같은 터미널 테마·글꼴(JetBrains Mono, SIL OFL 1.1)
      - path: ../WifiScan/Theme.swift
      - path: ../WifiScan/Fonts
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nagotl   # ← 본인 것으로 변경
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: NagoTLCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NAGO TL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 간판·메뉴 같은 사진을 찍어 번역할 때 써요
        NSPhotoLibraryAddUsageDescription: 번역한 그림을 사진 앱에 저장할 때 써요
        ITSAppUsesNonExemptEncryption: false
        # 다른 앱에서 "다음으로 열기 → NAGO TL"(CBZ/ZIP·PDF·그림)
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            LSHandlerRank: Owner
            LSItemContentTypes: [com.nagotl.cbz]
          - CFBundleTypeName: ZIP Archive
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.nagotl.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
