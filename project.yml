name: WifiScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # ← 본인 Team ID (developer.apple.com > Membership)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  WifiScan:
    type: application
    platform: iOS
    sources: [WifiScan]
    scheme: {}
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scantool   # ← 본인 것으로 변경 (NAGO VPN과 같이 깔리게 따로 둠)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: WifiScan/WifiScan.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    info:
      path: WifiScan/Info.plist
      properties:
        CFBundleDisplayName: scantool
        NSCameraUsageDescription: 와이파이 안내문과 문서를 촬영하는 데 카메라를 사용합니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  # 공유 시트의 "scantool". 특별한 권한(entitlement)이 없어서 서명할 때 App ID만 하나 더 있으면 된다.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - WifiScan/Theme.swift
      - WifiScan/QRCode.swift
      - WifiScan/FileShare.swift
      - WifiScan/TextRecognizer.swift
      - WifiScan/CredentialParser.swift
      - WifiScan/AccountParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scantool.share   # ← 앱 번들 ID + .share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: scantool
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
