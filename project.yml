name: WifiScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # ← 본인 Team ID (developer.apple.com > Membership)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  WifiScan:
    type: application
    platform: iOS
    sources: [WifiScan]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wifiscan   # ← 본인 것으로 변경
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
    entitlements:
      path: WifiScan/WifiScan.entitlements
      properties:
        com.apple.developer.networking.vpn.api: [allow-vpn]
    info:
      path: WifiScan/Info.plist
      properties:
        CFBundleDisplayName: NAGO VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 대시보드 사이트와 같은 글꼴(JetBrains Mono, SIL OFL 1.1 — WifiScan/Fonts/OFL-JetBrainsMono.txt)
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
