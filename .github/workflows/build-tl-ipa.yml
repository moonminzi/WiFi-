name: Build NAGO TL IPA

# NAGO TL(망가·사진 번역기)만 빌드한다. VPN 앱·NAGO DL과 따로 돈다.
on:
  push:
    paths:
      - 'NagoTL/**'
      - 'WifiScan/Theme.swift'
      - 'WifiScan/Fonts/**'
      - '.github/workflows/build-tl-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nagotl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 엔진 시험(리눅스와 같은 시험을 맥에서도)
      - name: Core tests
        run: swift test --package-path NagoTL/Core

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd NagoTL && xcodegen

      - name: Build (no signing)
        run: |
          xcodebuild -project NagoTL/NagoTL.xcodeproj -scheme NagoTL -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NagoTL.app Payload/
          # ad-hoc 서명(재서명 도구용)
          codesign --force --sign - Payload/NagoTL.app
          ls -la Payload/NagoTL.app
          zip -qry NagoTL.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NagoTL-ipa
          path: NagoTL.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nagotl-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" NagoTL.ipa --target "$GITHUB_SHA" --prerelease \
            --title "NAGO TL ${tag}" \
            --notes "서명 안 된 IPA입니다(ad-hoc 서명). 본인 인증서로 재서명 후 설치하세요. 브랜치: ${GITHUB_REF_NAME}"
