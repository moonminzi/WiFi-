name: Publish Android release (one-off)

on:
  push:
    branches: [apk-release-2.0.0]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-2.0.1 NAGO-VPN-2.0.1.apk \
            --target c286ccb3ee71f3a82bdc5ef037d261f8c55f7f1a \
            --title "NAGO VPN Android 2.0.1" \
            --notes-file release-notes.md
