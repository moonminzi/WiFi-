name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'NagoTun/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # NepTUN 엔진(NagoTun, Rust)을 안드로이드용 .so로 빌드한다(러너의 rustup + Android NDK 사용)
      - name: Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "NDK: ${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-none}}"

      # 공개 레포라 비밀번호를 넣지 않은 디버그 APK만 만든다(앱에서 비밀번호 입력).
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NagoVPN-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
