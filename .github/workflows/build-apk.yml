name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'NagoTun/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 저장소 secrets에 서명 키가 있으면 release APK도 만든다(Settings → Secrets and variables → Actions)
      HAS_KEY: ${{ secrets.NAGO_KEYSTORE_B64 != '' && secrets.NAGO_KEYSTORE_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # NepTUN 엔진(NagoTun, Rust)을 안드로이드용 .so로 빌드한다(러너의 rustup + Android NDK 사용)
      - name: Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "NDK: ${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-none}}"

      # 공개 레포라 비밀번호를 넣지 않은 디버그 APK만 만든다(앱에서 비밀번호 입력).
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NagoVPN-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 친구 폰에 깔린 앱 위에 덮어 깔리는 release APK(nago-release 키, com.nago.vpn).
      # 비밀번호(preset.txt)는 넣지 않는다 — 공개 레포라 artifact는 GitHub 계정이 있으면 누구나 받을 수 있다.
      # 비밀번호를 넣은 전달용 APK는 로컬에서 만든다(README 안드로이드 앱).
      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          NAGO_KEYSTORE_B64: ${{ secrets.NAGO_KEYSTORE_B64 }}
          NAGO_KEYSTORE_PASS: ${{ secrets.NAGO_KEYSTORE_PASS }}
        run: |
          echo "$NAGO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nago-release.jks"
          NAGO_KEYSTORE="$RUNNER_TEMP/nago-release.jks" NAGO_KEY_ALIAS=nago gradle -p android assembleRelease
          rm -f "$RUNNER_TEMP/nago-release.jks"
          # 서명 확인: 인증서 SHA-256이 39:B6:BC:E6…이어야 기존 앱 위에 깔린다
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: NagoVPN-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
