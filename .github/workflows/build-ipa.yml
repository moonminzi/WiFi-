name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore: ['worker/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['worker/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (no signing)
        run: |
          xcodebuild -project WifiScan.xcodeproj -scheme WifiScan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WifiScan.app Payload/
          # 재서명 도구가 권한을 그대로 가져가도록 entitlements를 바이너리에 박아 둔다(ad-hoc 서명)
          codesign --force --sign - --entitlements WifiScan/WifiScan.entitlements Payload/WifiScan.app
          codesign -d --entitlements - Payload/WifiScan.app
          zip -qry WifiScan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WifiScan-ipa
          path: WifiScan.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" WifiScan.ipa \
            --title "WifiScan ${tag}" \
            --notes "서명 안 된 IPA입니다(entitlements 포함 ad-hoc 서명). 본인 인증서로 재서명 후 설치하세요."
